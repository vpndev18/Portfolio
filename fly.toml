# Fly.io app config for the Portfolio API.
# See https://fly.io/docs/reference/configuration/ for all options.
#
# Deploy:
#   fly deploy --config fly.toml
#
# First time only:
#   fly apps create portfolio-api          (or change the app name below)
#   fly secrets set ConnectionStrings__Default='...' Admin__Key='...' \
#     Cors__AllowedOrigins__0='https://vallabh.dev' \
#     Cors__AllowedOrigins__1='https://www.vallabh.dev'
#   fly deploy

app = "portfolio-api"
primary_region = "iad"        # US East — co-locates with the Neon DB in us-east-1.
kill_signal  = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "Portfolio.API/Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS        = "http://+:8080"

[http_service]
  internal_port      = 8080
  force_https        = true
  auto_stop_machines = "suspend"  # suspend keeps memory warm → ~sub-second resume
  auto_start_machines = true
  min_machines_running = 1        # no cold starts; one shared-cpu-1x stays free

  [[http_service.checks]]
    grace_period   = "10s"
    interval       = "30s"
    method         = "GET"
    timeout        = "5s"
    path           = "/health"    # DB-free probe: never wakes Neon, never blocks
    protocol       = "http"

[[vm]]
  size      = "shared-cpu-1x"
  memory    = "512mb"
  cpu_kind  = "shared"
  cpus      = 1
